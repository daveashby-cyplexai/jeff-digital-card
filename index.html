<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1B263B"/>
<title>Jeff Erni · CyplexAI</title>
<meta name="description" content="Jeff Erni — Co-Founder | CFO & Chief Strategy Officer, CyplexAI"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --navy: #0D1B2A;
    --prussian: #1B263B;
    --dusk: #415A77;
    --denim: #778DA9;
    --magenta: #DB0D71;
    --lime: #DFFF76;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: var(--prussian);
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--white);
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at top, var(--dusk) 0%, var(--prussian) 45%, var(--navy) 100%);
    background-attachment: fixed;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .card {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    display: flex; flex-direction: column;
    position: relative;
    overflow: hidden;
    padding: 28px 24px 28px;
  }
  .card::before, .card::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  .card::before {
    top: -160px; right: -160px;
    width: 380px; height: 380px;
    background: radial-gradient(circle, rgba(219,13,113,0.36) 0%, transparent 65%);
  }
  .card::after {
    bottom: -120px; left: -100px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(223,255,118,0.16) 0%, transparent 65%);
  }
  .card > * { position: relative; z-index: 1; }

  .logo-bar {
    display: flex; justify-content: center;
    margin-bottom: 18px;
  }
  .logo-bar img {
    height: 44px; width: auto;
    max-width: 90%;
  }

  .hero {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 22px;
  }
  .photo {
    width: 124px; height: 124px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(13,27,42,0.4);
    background: linear-gradient(135deg, var(--dusk), var(--prussian));
    display: grid; place-items: center;
    position: relative;
  }
  .photo img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center 18%;
    display: block;
  }
  .photo .initials {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 44px;
    color: var(--white);
    letter-spacing: -1px;
  }
  .name {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 26px; line-height: 1.1;
    margin: 14px 0 4px;
    letter-spacing: -0.4px;
    color: var(--white);
    text-align: center;
  }
  .title {
    font-size: 13.5px;
    font-weight: 400;
    color: var(--denim);
    text-align: center;
    text-wrap: pretty;
    max-width: 320px;
    line-height: 1.4;
    margin: 0;
  }

  .qr-section {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 10px 0;
  }
  .qr-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: var(--lime);
    margin-bottom: 14px;
  }
  .qr-card {
    padding: 18px;
    border-radius: 22px;
    background: var(--white);
    border: 1px solid rgba(255,255,255,0.20);
    box-shadow: 0 14px 44px rgba(0,0,0,0.34), 0 0 0 4px rgba(255,255,255,0.06);
  }
  .qr-card #qr canvas, .qr-card #qr img {
    display: block;
    width: 100% !important; height: auto !important;
    max-width: 260px;
  }
  .qr-card #qr {
    width: 260px; height: 260px;
    display: grid; place-items: center;
  }
  .qr-loading {
    color: var(--denim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
  }
  .website {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--lime);
    margin-top: 14px;
    letter-spacing: 0.3px;
  }
  .website a { color: inherit; text-decoration: none; }

  .toggle {
    margin-top: 20px;
    position: relative;
    display: grid; grid-template-columns: 1fr 1fr;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 100px;
    padding: 4px;
    height: 44px;
    cursor: pointer;
    user-select: none;
  }
  .toggle-thumb {
    position: absolute;
    top: 4px; bottom: 4px;
    left: 4px;
    width: calc(50% - 4px);
    background: var(--white);
    border-radius: 100px;
    box-shadow: 0 2px 10px rgba(27,38,59,0.20);
    transition: left 0.35s cubic-bezier(.6,.05,.25,1);
  }
  .toggle[data-tab="family"] .toggle-thumb { left: 50%; }
  .toggle button {
    position: relative; z-index: 1;
    background: none; border: none; cursor: pointer;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600; font-size: 14px;
    color: var(--denim);
    transition: color .25s ease;
    padding: 0;
  }
  .toggle[data-tab="business"] button[data-tab="business"],
  .toggle[data-tab="family"]   button[data-tab="family"] {
    color: var(--navy);
  }

  .footnote {
    margin-top: 18px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: rgba(119,141,169,0.7);
  }
</style>
</head>
<body>

<main class="card" aria-label="Digital business card">
  <div class="logo-bar">
    <img src="assets/logo.png" alt="CyplexAI"/>
  </div>

  <section class="hero">
    <div class="photo">
      <!-- Drop a real photo at assets/jeff.jpg (or .png). The onerror fallback shows initials. -->
      <img src="assets/jeff.jpg" alt="Jeff Erni"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
           style="object-position: center 22%;"/>
      <span class="initials" style="display:none;">JE</span>
    </div>
    <h1 class="name">Jeff Erni</h1>
    <p class="title">Co-Founder &nbsp;|&nbsp; CFO &amp; Chief Strategy Officer</p>
  </section>

  <section class="qr-section">
    <div class="qr-eyebrow">Scan to visit</div>
    <div class="qr-card">
      <div id="qr"><span class="qr-loading">generating…</span></div>
    </div>
    <div class="website">
      <a href="https://cyplexai.com" target="_blank" rel="noopener">cyplexai.com</a>
    </div>
  </section>

  <div class="toggle" data-tab="business" role="tablist" aria-label="Card mode">
    <div class="toggle-thumb" aria-hidden="true"></div>
    <button type="button" data-tab="business" role="tab">Business</button>
    <button type="button" data-tab="family" role="tab">Family</button>
  </div>

  <div class="footnote">CyplexAI · Think with AI</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
  (function renderQR() {
    var host = document.getElementById('qr');
    if (!host) return;
    if (!window.QRCode) { setTimeout(renderQR, 80); return; }
    host.innerHTML = '';
    new QRCode(host, {
      text: 'https://cyplexai.com',
      width: 260,
      height: 260,
      colorDark: '#0D1B2A',
      colorLight: '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.H,
    });
  })();

  document.querySelectorAll('.toggle button').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var t = btn.dataset.tab;
      btn.closest('.toggle').setAttribute('data-tab', t);
    });
  });
  document.querySelector('.toggle').addEventListener('click', function (e) {
    if (e.target.tagName === 'BUTTON') return;
    var cur = this.getAttribute('data-tab');
    this.setAttribute('data-tab', cur === 'business' ? 'family' : 'business');
  });
</script>
</body>
</html>
